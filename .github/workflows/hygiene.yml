name: hygiene

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Validate package shape
        run: python -B code-hygiene-compounder/scripts/validate_package.py --repo-root . --doctor

      - name: Check context index
        run: python -B code-hygiene-compounder/scripts/source_audit_plan.py --skill-root code-hygiene-compounder --context-index --out code-hygiene-compounder/references/context-index.json --check

      - name: Smoke export Claude AI package
        run: python -B code-hygiene-compounder/scripts/export_claude_package.py --skill-root code-hygiene-compounder --out-dir "${{ runner.temp }}/export-smoke" --format claude-ai-skill --zip-name code-hygiene-compounder-claude-ai.zip

      - name: Check overtraining guardrails
        run: python -B code-hygiene-compounder/scripts/guardrail_check.py --skill-root code-hygiene-compounder

      - name: Validate PASS-100 prompt suite
        run: python -B code-hygiene-compounder/scripts/pass100_runner.py list --suite code-hygiene-compounder/references/eval-prompts.md

      - name: Validate fixture metadata
        run: python -B code-hygiene-compounder/scripts/fixture_runner.py --fixtures code-hygiene-compounder/fixtures validate --suite code-hygiene-compounder/references/eval-prompts.md

      - name: Confirm fixture baselines
        run: python -B code-hygiene-compounder/scripts/fixture_runner.py --fixtures code-hygiene-compounder/fixtures baseline

      - name: Exercise PASS-100 result tooling
        shell: python
        run: |
          import json
          from pathlib import Path

          categories = {
              "correctness": 15,
              "tests": 15,
              "maintainability": 15,
              "security": 10,
              "local_integration": 10,
              "minimal_diff": 10,
              "observability": 10,
              "documentation": 5,
              "dependencies": 5,
              "agent_process": 5,
          }
          payload = {
              "run_id": "ci-script-only",
              "run_type": "script-only",
              "phase": 0,
              "prompt_ids": ["HYG-001"],
              "scores": [
                  {
                      "prompt_id": "HYG-001",
                      "total": 100,
                      "categories": categories,
                      "deductions": [],
                      "lessons": [],
                  }
              ],
          }
          out = Path("ci-pass100-result.json")
          out.write_text(json.dumps(payload), encoding="utf-8")

      - name: Validate PASS-100 result schema
        run: python -B code-hygiene-compounder/scripts/validate_results.py --results ci-pass100-result.json --suite code-hygiene-compounder/references/eval-prompts.md --source-weights code-hygiene-compounder/references/source-weights.json

      - name: Analyze PASS-100 run
        run: python -B code-hygiene-compounder/scripts/analyze_runs.py --results ci-pass100-result.json --suite code-hygiene-compounder/references/eval-prompts.md --source-weights code-hygiene-compounder/references/source-weights.json
