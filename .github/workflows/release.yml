name: release

on:
  push:
    tags:
      - "code-hygiene-compounder--v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify tag and manifest versions
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          prefix = "code-hygiene-compounder--v"
          if not tag.startswith(prefix):
              raise SystemExit(f"unexpected release tag: {tag}")
          expected = tag.removeprefix(prefix)
          paths = (
              Path("code-hygiene-compounder/.claude-plugin/plugin.json"),
              Path("plugins/code-hygiene-compounder/.codex-plugin/plugin.json"),
          )
          versions = {json.loads(path.read_text(encoding="utf-8"))["version"] for path in paths}
          if versions != {expected}:
              raise SystemExit(f"tag {expected} does not match manifest versions: {sorted(versions)}")

      - name: Run release gates
        run: |
          python -B -m unittest discover -s tests -v
          python -B code-hygiene-compounder/scripts/validate_package.py --repo-root . --doctor
          python -B code-hygiene-compounder/scripts/guardrail_check.py --skill-root code-hygiene-compounder
          python -B code-hygiene-compounder/scripts/fixture_runner.py --fixtures code-hygiene-compounder/fixtures validate --suite code-hygiene-compounder/references/eval-prompts.md
          python -B code-hygiene-compounder/scripts/fixture_runner.py --fixtures code-hygiene-compounder/fixtures baseline

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/release"
          mkdir -p "$dist"
          python -B code-hygiene-compounder/scripts/export_claude_package.py --skill-root code-hygiene-compounder --out-dir "${RUNNER_TEMP}/claude-code" --format claude-code-skill --zip-name code-hygiene-compounder-claude-code.zip
          python -B code-hygiene-compounder/scripts/export_claude_package.py --skill-root code-hygiene-compounder --out-dir "${RUNNER_TEMP}/claude-ai" --format claude-ai-skill --zip-name code-hygiene-compounder-claude-ai.zip
          python -B code-hygiene-compounder/scripts/export_claude_package.py --skill-root code-hygiene-compounder --out-dir "${RUNNER_TEMP}/legacy" --format legacy-command --zip-name code-hygiene-compounder-legacy-command.zip
          cp "${RUNNER_TEMP}/claude-code/code-hygiene-compounder-claude-code.zip" "$dist/"
          cp "${RUNNER_TEMP}/claude-ai/code-hygiene-compounder-claude-ai.zip" "$dist/"
          cp "${RUNNER_TEMP}/legacy/code-hygiene-compounder-legacy-command.zip" "$dist/"
          DIST="$dist" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("code-hygiene-compounder/scripts").resolve()))
          from export_claude_package import zip_dir

          dist = Path(os.environ["DIST"])
          for source_name in ("code-hygiene", "code-hygiene-skeleton"):
              source = Path(source_name)
              zip_dir(source, dist / f"{source_name}.zip", prefix=source_name)
          checksums = []
          for path in sorted(dist.glob("*.zip")):
              checksums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (dist / "SHA256SUMS.txt").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${RUNNER_TEMP}/release/"* --verify-tag --title "Great Code Hygiene ${GITHUB_REF_NAME#code-hygiene-compounder--v}" --generate-notes
